# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

tasks:
  default:
    desc: Lista todas as tarefas
    cmds:
      - task --list

  verify:
    desc: Verifica se o DMG é válido
    cmds:
      - spctl -a -t exec -vv "dmg/converter 1.0.0.dmg"

  run:
    desc: Executa a aplicação
    cmds:
      - go run .

  create-dmg:
    desc: Cria o DMG
    cmds:
      - go build -o binary/converter .
      - cp binary/converter Converter.app/Contents/MacOS/converter
      - mkdir -p Converter.app/Contents/Resources
      - cp images/icon.png images/loading.png Converter.app/Contents/Resources/
      - mkdir -p dmg
      - create-dmg Converter.app
      - mv converter*.dmg dmg/